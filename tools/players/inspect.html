<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>next264 VMAF Inspector</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #1a1a2e; color: #e0e0e0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }

.header { padding: 12px 20px; background: #16213e; border-bottom: 1px solid #0f3460; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }
.header h1 { font-size: 16px; font-weight: 600; }
.stats { font-size: 13px; opacity: 0.85; }
.stats .avg { color: #4ade80; } .stats .min { color: #f87171; }

.wrap { max-width: 1280px; margin: 20px auto; padding: 0 20px; }
.player-container { position: relative; width: 100%; background: #000; aspect-ratio: 16/9; overflow: hidden; }
.player-container video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
.vmaf-overlay { position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.8); padding: 6px 14px; border-radius: 4px; font-size: 14px; z-index: 5; font-variant-numeric: tabular-nums; }
.pick { position: absolute; top: 8px; right: 8px; z-index: 5; }
.pick select { background: rgba(0,0,0,0.7); color: #e0e0e0; border: 1px solid #333; border-radius: 4px; padding: 3px 6px; font-size: 12px; }

.controls { padding: 10px 0; }
.controls button { background: #0f3460; border: 1px solid #1a1a5e; color: #e0e0e0; padding: 6px 14px; border-radius: 4px; cursor: pointer; margin-right: 6px; font-size: 13px; }
.controls button:hover { background: #1a1a5e; }
.time-display { font-size: 13px; font-variant-numeric: tabular-nums; float: right; line-height: 32px; }

.graph-bar { position: relative; height: 140px; background: #16213e; border-radius: 4px; cursor: pointer; overflow: hidden; margin-top: 6px; }
.graph-progress { position: absolute; top: 0; left: 0; height: 100%; background: rgba(255,255,255,0.06); }
.playhead { position: absolute; top: 0; height: 100%; width: 2px; background: #fff; z-index: 3; pointer-events: none; }
#vmaf-canvas { position: absolute; inset: 0; }
.dip-marker { position: absolute; top: 0; height: 100%; width: 3px; cursor: pointer; z-index: 2; }
.dip-marker.warning { background: rgba(251,191,36,0.6); }
.dip-marker.critical { background: rgba(248,113,113,0.8); }
.dip-marker:hover { width: 5px; }
.axis { font-size: 11px; opacity: 0.55; margin-top: 4px; display: flex; justify-content: space-between; }

.dip-list { margin: 16px 0; }
.dip-list h3 { font-size: 14px; margin-bottom: 8px; color: #f87171; }
.dips { display: flex; flex-wrap: wrap; gap: 6px; }
.dip-btn { background: #16213e; border: 1px solid #333; padding: 4px 10px; border-radius: 4px; cursor: pointer; font-size: 12px; color: #e0e0e0; }
.dip-btn.critical { border-color: #f87171; } .dip-btn.warning { border-color: #fbbf24; }
.dip-btn:hover { background: #1a1a5e; }
.err { margin: 20px 0; padding: 16px 20px; background: #3b1a1a; border: 1px solid #f87171; border-radius: 4px; font-size: 13px; line-height: 1.5; }
</style>
</head>
<body>

<div class="header">
  <h1 id="title">next264 VMAF Inspector</h1>
  <div class="stats">
    VMAF avg <span class="avg" id="stat-avg">--</span> |
    min <span class="min" id="stat-min">--</span> |
    max <span id="stat-max">--</span> |
    <span id="stat-dips">0</span> dips
  </div>
</div>

<div class="wrap">
  <div id="err" class="err" style="display:none"></div>

  <div class="player-container" id="player-container">
    <video id="video" muted playsinline></video>
    <div class="pick" id="pick" style="display:none"><select id="enc-select"></select></div>
    <div class="vmaf-overlay" id="vmaf-overlay">VMAF: --</div>
  </div>

  <div class="controls">
    <button id="btn-play">Play</button>
    <button id="btn-prev">&#9664; Frame</button>
    <button id="btn-next">Frame &#9654;</button>
    <button id="btn-worst">Jump to worst frame</button>
    <button id="btn-prev-dip">&#9888; Prev Dip</button>
    <button id="btn-next-dip">Next Dip &#9888;</button>
    <span class="time-display" id="time-display">0:00 / 0:00</span>
  </div>

  <div class="graph-bar" id="graph-bar">
    <div class="graph-progress" id="graph-progress"></div>
    <canvas id="vmaf-canvas"></canvas>
    <div class="playhead" id="playhead"></div>
  </div>
  <div class="axis"><span>0:00</span><span>click the graph or a dip to jump to that frame</span><span id="axis-end">0:00</span></div>

  <div class="dip-list" id="dip-list">
    <h3>Quality dips (click to seek and inspect)</h3>
    <div class="dips" id="dip-buttons"></div>
  </div>
</div>

<script>
// data schema (from make_vmaf.py): { reference, fps, model,
//   encodings: [ {label, video, frames:[{frame,time,vmaf}], avgVmaf, minVmaf, maxVmaf}, ... ] }
let data = null, enc = null, fps = 30, dips = [], currentDipIdx = -1, isPlaying = false;
const $ = id => document.getElementById(id);
const video = $('video'), graphBar = $('graph-bar'), graphProgress = $('graph-progress');
const playhead = $('playhead'), vmafCanvas = $('vmaf-canvas'), vmafOverlay = $('vmaf-overlay');

function fail(msg) { const e = $('err'); e.style.display = 'block'; e.textContent = msg; }

const dataUrl = new URLSearchParams(location.search).get('data') || 'data-inspect.json';
fetch(dataUrl).then(r => { if (!r.ok) throw new Error(r.status + ' ' + r.statusText); return r.json(); })
  .then(init)
  .catch(e => fail('Could not load ' + dataUrl + ': ' + e.message +
    '. Run make_vmaf.py, and serve this directory (see serve.sh).'));

function init(d) {
  data = d; fps = d.fps || 30;
  const encs = d.encodings || [];
  if (!encs.length) { fail('No encodings in ' + dataUrl); return; }
  if (encs.length > 1) {
    $('pick').style.display = 'block';
    const sel = $('enc-select');
    encs.forEach((e, i) => { const o = document.createElement('option'); o.value = i; o.textContent = e.label; sel.appendChild(o); });
    sel.addEventListener('change', () => selectEnc(encs[+sel.value]));
  }
  selectEnc(encs[0]);
}

function selectEnc(e) {
  enc = e;
  const frames = e.frames || [];
  video.src = e.video;
  $('title').textContent = e.label + '   (' + (data.model || 'vmaf') + ')';
  $('stat-avg').textContent = e.avgVmaf.toFixed(2);
  $('stat-min').textContent = e.minVmaf.toFixed(2);
  $('stat-max').textContent = e.maxVmaf.toFixed(2);
  dips = findDips(frames);
  $('stat-dips').textContent = dips.length;
  if (dips.length === 0) $('dip-list').style.display = 'none'; else $('dip-list').style.display = 'block';
  rebuildDips();
  video.addEventListener('loadedmetadata', ready, { once: true });
  if (video.readyState >= 1) ready();
}
let started = false;
function ready() {
  const dur = video.duration || (enc.frames.length / fps);
  $('axis-end').textContent = fmt(dur);
  drawGraph();
  if (!started) { started = true; requestAnimationFrame(updateUI); }
}

function findDips(frames, warn = 5, crit = 10) {
  if (!frames.length) return [];
  const avg = frames.reduce((s, f) => s + f.vmaf, 0) / frames.length;
  let out = [];
  for (const f of frames) {
    if (f.vmaf < avg - crit) out.push({ ...f, severity: 'critical' });
    else if (f.vmaf < avg - warn) out.push({ ...f, severity: 'warning' });
  }
  if (out.length > 60) { out.sort((a, b) => a.vmaf - b.vmaf); out = out.slice(0, 60); out.sort((a, b) => a.time - b.time); }
  return out;
}

const fmt = s => Math.floor(s / 60) + ':' + ('0' + Math.floor(s % 60)).slice(-2);

$('btn-play').addEventListener('click', togglePlay);
function togglePlay() {
  if (isPlaying) { video.pause(); $('btn-play').textContent = 'Play'; }
  else { video.play(); $('btn-play').textContent = 'Pause'; }
  isPlaying = !isPlaying;
}
$('btn-prev').addEventListener('click', () => seekRel(-1 / fps));
$('btn-next').addEventListener('click', () => seekRel(1 / fps));
$('btn-worst').addEventListener('click', () => {
  const fr = (enc.frames || []).reduce((m, f) => f.vmaf < m.vmaf ? f : m, enc.frames[0]);
  if (fr) seekTo(fr.time);
});
$('btn-prev-dip').addEventListener('click', () => { if (dips.length) { currentDipIdx = Math.max(0, currentDipIdx - 1); seekTo(dips[currentDipIdx].time); } });
$('btn-next-dip').addEventListener('click', () => { if (dips.length) { currentDipIdx = Math.min(dips.length - 1, currentDipIdx + 1); seekTo(dips[currentDipIdx].time); } });
function seekRel(dt) { seekTo(Math.max(0, video.currentTime + dt)); }
function seekTo(t) { video.currentTime = t; if (isPlaying) togglePlay(); }

graphBar.addEventListener('click', e => {
  const r = graphBar.getBoundingClientRect();
  seekTo(((e.clientX - r.left) / r.width) * (video.duration || 0));
});

function frameAt(t) {
  const frames = enc.frames || [];
  if (!frames.length) return null;
  const i = Math.round(t * fps);
  return frames[Math.min(Math.max(i, 0), frames.length - 1)];
}

function updateUI() {
  const t = video.currentTime, dur = video.duration || 0;
  if (dur) { graphProgress.style.width = (t / dur * 100) + '%'; playhead.style.left = (t / dur * 100) + '%'; }
  $('time-display').textContent = fmt(t) + ' / ' + fmt(dur);
  const f = frameAt(t);
  if (f) {
    const c = f.vmaf >= 90 ? '#4ade80' : f.vmaf >= 70 ? '#fbbf24' : '#f87171';
    vmafOverlay.innerHTML = 'frame ' + f.frame + ' &nbsp; VMAF <b style="color:' + c + '">' + f.vmaf.toFixed(1) + '</b>';
  }
  requestAnimationFrame(updateUI);
}

function drawGraph() {
  const frames = enc.frames || [];
  const r = graphBar.getBoundingClientRect(), w = r.width, h = r.height, dpr = 2;
  vmafCanvas.width = w * dpr; vmafCanvas.height = h * dpr;
  vmafCanvas.style.width = w + 'px'; vmafCanvas.style.height = h + 'px';
  const ctx = vmafCanvas.getContext('2d'); ctx.scale(dpr, dpr);
  ctx.clearRect(0, 0, w, h);
  const dur = video.duration || (frames.length / fps) || 1;
  const lo = 60, hi = 100, yOf = v => h - ((Math.max(lo, Math.min(hi, v)) - lo) / (hi - lo)) * h;
  [70, 80, 90].forEach(g => {
    ctx.strokeStyle = 'rgba(255,255,255,0.08)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(0, yOf(g)); ctx.lineTo(w, yOf(g)); ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,0.35)'; ctx.font = '10px sans-serif'; ctx.fillText(g, 3, yOf(g) - 2);
  });
  if (!frames.length) return;
  ctx.beginPath(); ctx.strokeStyle = 'rgba(74,222,128,0.85)'; ctx.lineWidth = 1.5;
  frames.forEach((f, i) => { const x = (f.time / dur) * w, y = yOf(f.vmaf); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); });
  ctx.stroke();
  ctx.lineTo(w, h); ctx.lineTo(0, h); ctx.closePath(); ctx.fillStyle = 'rgba(74,222,128,0.08)'; ctx.fill();
  // average line
  ctx.beginPath(); ctx.strokeStyle = 'rgba(255,255,255,0.3)'; ctx.setLineDash([4, 4]);
  ctx.moveTo(0, yOf(enc.avgVmaf)); ctx.lineTo(w, yOf(enc.avgVmaf)); ctx.stroke(); ctx.setLineDash([]);
}
window.addEventListener('resize', () => { if (enc) drawGraph(); });

function rebuildDips() {
  // clear old markers/buttons
  graphBar.querySelectorAll('.dip-marker').forEach(m => m.remove());
  const box = $('dip-buttons'); box.innerHTML = '';
  const dur = video.duration || (enc.frames.length / fps) || 1;
  dips.forEach((d, i) => {
    const m = document.createElement('div');
    m.className = 'dip-marker ' + d.severity;
    m.style.left = (d.time / dur * 100) + '%';
    m.title = 'VMAF ' + d.vmaf.toFixed(1) + ' @ frame ' + d.frame;
    m.addEventListener('click', e => { e.stopPropagation(); seekTo(d.time); });
    graphBar.appendChild(m);
    const b = document.createElement('button');
    b.className = 'dip-btn ' + d.severity;
    b.textContent = d.time.toFixed(2) + 's (VMAF ' + d.vmaf.toFixed(0) + ')';
    b.addEventListener('click', () => { currentDipIdx = i; seekTo(d.time); });
    box.appendChild(b);
  });
}

document.addEventListener('keydown', e => {
  switch (e.key) {
    case ' ': e.preventDefault(); togglePlay(); break;
    case 'ArrowLeft': seekRel(-1 / fps); break;
    case 'ArrowRight': seekRel(1 / fps); break;
    case '[': $('btn-prev-dip').click(); break;
    case ']': $('btn-next-dip').click(); break;
  }
});
</script>
</body>
</html>
